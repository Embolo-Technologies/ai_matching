      \ \"$METADATA_HEADER\" \"$METADATA_BASE/gpu_job_id\" || echo \"\")\nBACKEND_URL=$(curl\
      \ -sf -H \"$METADATA_HEADER\" \"$METADATA_BASE/backend_url\" || echo \"\")\n\
      SIGNAL_SECRET=$(curl -sf -H \"$METADATA_HEADER\" \"$METADATA_BASE/gpu_signal_secret\"\
      \ || echo \"\")\n\nif [[ -z \"$JOB_ID\" || -z \"$BACKEND_URL\" || -z \"$SIGNAL_SECRET\"\
      \ ]]; then\n    log \"ERROR: Missing required metadata. Ensure job_id, backend_url,\
      \ and secret are set.\"\n    exit 1\nfi\n\n# \u2500\u2500 Update fast_server.py\
      \ from metadata \u2500\u2500\nlog \"Updating fast_server.py with bulk-matching\
      \ capabilities...\"\ncurl -sf -H \"$METADATA_HEADER\" \"$METADATA_BASE/fast_server_code\"\
      \ > /home/admin/ai/qwen3_engine/fast_server.py\nchown admin:admin /home/admin/ai/qwen3_engine/fast_server.py\n\
      chmod 700 /home/admin/ai/qwen3_engine/fast_server.py\n\n# \u2500\u2500 Start\
      \ the fast server \u2500\u2500\nlog \"Starting fast_server.py on port 8080...\"\
      \nfuser -k 8080/tcp || true\nsudo -u admin bash -c \"export PYTHONPATH=/home/admin/ai;\
      \ export PYTHONIOENCODING=utf-8; nohup /home/admin/ai/venv/bin/python3 /home/admin/ai/qwen3_engine/fast_server.py\
      \ --csv /home/admin/ai/Item_export_2026-05-29_17-33-30.csv > /home/admin/ai/fast_server_run.log\
      \ 2>&1 &\"\n\n# \u2500\u2500 Wait for port 8080 \u2500\u2500\nELAPSED=0\nREADY=0\n\
      while [ $ELAPSED -lt 300 ]; do\n    HTTP_CODE=$(curl -sf -o /dev/null -w \"\
      %{http_code}\" --max-time 3 \"http://localhost:8080/health\" || echo \"000\"\
